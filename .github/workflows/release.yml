name: release

# Push a tag and GitHub builds Linux binaries, then attaches them to a release.
# deploy/install.sh downloads these; if a release is missing it falls back to
# compiling from source, so a broken CI run never blocks an install.
#
#   git tag v0.1.0 && git push --tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static: works on any distro, including Alpine.
          - target: x86_64-unknown-linux-musl
            apt: musl-tools
            linker: musl-gcc
          # ARM servers: glibc build, cross-compiled with the Debian toolchain.
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          # cargo reads the linker from CARGO_TARGET_<T>_LINKER; the cc crate
          # picks up the matching <target>-gcc for ring's C and asm parts.
          VAR="CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER"
          export "$VAR=$LINKER"
          cargo build --locked --release --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/veil" dist/veil
          chmod +x dist/veil
          tar -C dist -czf "veil-$TARGET.tar.gz" veil
          sha256sum "veil-$TARGET.tar.gz" > "veil-$TARGET.tar.gz.sha256"
          cat "veil-$TARGET.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            veil-${{ matrix.target }}.tar.gz
            veil-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
